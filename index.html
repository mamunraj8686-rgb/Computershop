<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F4C81">
    <title>মেরামত টিকিট সিস্টেম</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, 'Noto Sans Bengali', sans-serif; }
        :root {
            --primary: #0F4C81; --success: #22C55E; --whatsapp: #25D366;
            --danger: #EF4444; --light: #F8FAFC; --dark: #1E293B; --border: #E2E8F0; --radius: 10px;
        }
        body { background: var(--light); color: var(--dark); min-height: 100vh; padding: 16px; max-width: 500px; margin: 0 auto; }

        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left:0; top:0; width:100%; padding:20px; }
            .no-print { display: none !important; }
        }

        .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .menu-btn { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--primary); flex: 1; text-align: center; }
        .card { background: white; border-radius: var(--radius); box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 14px; font-weight: 600; color: #475569; }
        input, textarea { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: transparent; color: var(--dark); }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }
        .btn { padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; width: 100%; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-small { width: auto; padding: 8px 12px; font-size: 13px; margin: 0; }
        .btn-whatsapp { background: var(--whatsapp); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .list-item { padding: 14px; border-bottom: 1px solid var(--border); margin-bottom: 12px; border-radius: 8px; background: white; }
        .list-item strong { font-size: 15px; display: block; margin-bottom: 4px; }
        .list-item small { font-size: 13px; opacity: 0.8; display: block; margin-bottom: 6px; }
        .item-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    </style>
</head>
<body>

<div class="page-header no-print">
    <button class="menu-btn">☰</button>
    <h1 class="page-title">মেরামত টিকিট</h1>
</div>

<div class="card">
    <h2 style="font-size:18px; color:var(--primary); margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--border);">নতুন মেরামত টিকিট তৈরি</h2>
    
    <div class="form-group">
        <label for="tCustName">গ্রাহকের নাম</label>
        <input type="text" id="tCustName" placeholder="উদাহরণ: ফাজিল আহমেদ" required>
    </div>

    <div class="form-group">
        <label for="tDevice">ডিভাইসের ধরন ও মডেল</label>
        <input type="text" id="tDevice" placeholder="উদাহরণ: ল্যাপটপ - ডেল ইন্সপিরন 3501" required>
    </div>

    <div class="form-group">
        <label for="tProblem">সমস্যার বিবরণ</label>
        <textarea id="tProblem" rows="3" placeholder="উদাহরণ: চালু হয় না, চার্জ পোর্ট নষ্ট"></textarea>
    </div>

    <div class="form-group">
        <label for="tCost">আনুমানিক খরচ (টাকা)</label>
        <input type="number" id="tCost" min="0" placeholder="উদাহরণ: ১২০০" required>
    </div>

    <div class="form-group">
        <label for="tAdvance">অগ্রিম গ্রহণ (টাকা)</label>
        <input type="number" id="tAdvance" min="0" value="0" placeholder="উদাহরণ: ৫০০">
    </div>

    <button class="btn btn-primary" onclick="saveTicket()">✅ টিকিট সংরক্ষণ করুন</button>
</div>

<h2 style="font-size:18px; color:var(--primary); margin-bottom:12px;">টিকিট তালিকা</h2>
<div id="ticketList">
    <div class="card" style="text-align:center; opacity:0.7;">এখনো কোনো টিকিট তৈরি করা হয়নি</div>
</div>

<script>
const STORAGE_KEY = 'repair_ticket_system';
let tickets = [];

// শুরুতে ডেটা লোড
document.addEventListener('DOMContentLoaded', () => {
    loadTickets();
    showTickets();
});

// সংরক্ষণ ও লোড
function loadTickets() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) tickets = JSON.parse(saved);
}
function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
}

// নতুন টিকিট সংরক্ষণ (এখানে সব id ঠিক করা হয়েছে)
function saveTicket() {
    // সঠিক আইডি দিয়ে মান নিচ্ছি
    const custName = document.getElementById('tCustName').value.trim();
    const device = document.getElementById('tDevice').value.trim();
    const problem = document.getElementById('tProblem').value.trim() || 'উল্লেখ নেই';
    const cost = document.getElementById('tCost').value.trim();
    const advance = document.getElementById('tAdvance').value.trim() || '0';

    // প্রয়োজনীয় তথ্য চেক
    if(!custName) return alert('⚠️ দয়া করে গ্রাহকের নাম লিখুন!');
    if(!device) return alert('⚠️ দয়া করে ডিভাইসের বিবরণ লিখুন!');
    if(!cost) return alert('⚠️ দয়া করে আনুমানিক খরচ লিখুন!');

    // নতুন টিকিট যুক্ত
    tickets.unshift({
        id: Date.now(),
        custName: custName,
        device: device,
        problem: problem,
        cost: cost,
        advance: advance,
        date: new Date().toISOString()
    });

    // ফর্ম খালি করা
    document.getElementById('tCustName').value = '';
    document.getElementById('tDevice').value = '';
    document.getElementById('tProblem').value = '';
    document.getElementById('tCost').value = '';
    document.getElementById('tAdvance').value = '0';

    saveToStorage();
    showTickets();
    alert('✅ টিকিট সফলভাবে সংরক্ষণ করা হয়েছে!');
}

// টিকিট তালিকা দেখানো
function showTickets() {
    const listDiv = document.getElementById('ticketList');
    if(tickets.length === 0) {
        listDiv.innerHTML = '<div class="card" style="text-align:center; opacity:0.7;">এখনো কোনো টিকিট তৈরি করা হয়নি</div>';
        return;
    }
    listDiv.innerHTML = tickets.map(t => {
        const due = Number(t.cost) - Number(t.advance);
        return `
        <div class="list-item">
            <strong>${t.custName} — ${t.device}</strong>
            <small>সমস্যা: ${t.problem}</small>
            <small>মোট খরচ: ${t.cost} টাকা | অগ্রিম: ${t.advance} টাকা | বাকি: ${due} টাকা</small>
            <small>তারিখ: ${new Date(t.date).toLocaleString('bn-BD')}</small>
            <div class="item-actions">
                <button class="btn-small btn-primary no-print" onclick="printThis(${t.id})">🖨️ প্রিন্ট</button>
                <button class="btn-small btn-whatsapp no-print" onclick="sendWA(${t.id})">💚 হোয়াটসঅ্যাপ</button>
                <button class="btn-small btn-danger no-print" onclick="deleteThis(${t.id})">❌ মুছুন</button>
            </div>
        </div>`;
    }).join('');
}

// টিকিট মুছে ফেলা
function deleteThis(id) {
    if(confirm('এই টিকিট স্থায়ীভাবে মুছে ফেলা নিশ্চিত করছেন?')) {
        tickets = tickets.filter(t => t.id !== id);
        saveToStorage();
        showTickets();
    }
}

// প্রিন্ট ফাংশন
function printThis(id) {
    const t = tickets.find(x => x.id === id);
    if(!t) return alert('❌ টিকিট পাওয়া যায়নি!');
    const due = Number(t.cost) - Number(t.advance);
    const printWin = window.open('', '_blank');
    printWin.document.write(`
    <html><head><title>মেরামত টিকিট</title></head><body class="print-area" style="padding:25px; font-family: 'Noto Sans Bengali', sans-serif;">
        <h2 style="text-align:center; color:#0F4C81; border-bottom: 2px dashed #333; padding-bottom:10px;">কম্পিউটার ও মেরামত সেবা কেন্দ্র</h2>
        <h3 style="margin:15px 0 8px;">মেরামত টিকিট</h3>
        <p><strong>গ্রাহকের নাম:</strong> ${t.custName}</p>
        <p><strong>ডিভাইসের বিবরণ:</strong> ${t.device}</p>
        <p><strong>সমস্যার বিবরণ:</strong> ${t.problem}</p>
        <p><strong>আনুমানিক খরচ:</strong> ${t.cost} টাকা</p>
        <p><strong>অগ্রিম গ্রহণ:</strong> ${t.advance} টাকা</p>
        <p><strong>বাকি প্রদেয়:</strong> ${due} টাকা</p>
        <p><strong>তৈরির তারিখ ও সময়:</strong> ${new Date(t.date).toLocaleString('bn-BD')}</p>
        <hr style="border:1px dashed #999; margin:20px 0;">
        <p style="text-align:right;">গ্রাহকের স্বাক্ষর: ____________________</p>
    </body></html>`);
    printWin.document.close();
    setTimeout(() => printWin.print(), 600);
}

// হোয়াটসঅ্যাপ পাঠানো
function sendWA(id) {
    const t = tickets.find(x => x.id === id);
    if(!t) return alert('❌ টিকিট পাওয়া যায়নি!');
    const due = Number(t.cost) - Number(t.advance);
    const message = encodeURIComponent(`হ্যালো ${t.custName}, আপনার মেরামত টিকিট নিশ্চিত করা হলো:
✅ ডিভাইস: ${t.device}
✅ সমস্যা: ${t.problem}
✅ মোট খরচ: ${t.cost} টাকা
✅ অগ্রিম নিয়েছি: ${t.advance} টাকা
✅ বাকি দিতে হবে: ${due} টাকা

দ্রুত যোগাযোগ রাখুন, ধন্যবাদ!`);
    let number = prompt('গ্রাহকের মোবাইল নম্বর দিন (যেমন: 88017123456789):', '');
    if(!number) return;
    number = number.replace(/\D/g, '');
    if(!number.startsWith('880')) number = '880' + number.replace(/^0+/, '');
    window.open(`https://wa.me/${number}?text=${message}`, '_blank');
}
</script>
</body>
</html>
