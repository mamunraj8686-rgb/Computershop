<div class="item-actions">
    <button class="btn-small btn-warning no-print">সম্পাদনা</button>
    <button class="btn-small btn-primary no-print" onclick="printTicket(${t.id})">🖨️ প্রিন্ট</button>
    <button class="btn-small btn-info no-print" onclick="sendVia('sms',${t.id})">📩 এসএমএস</button>
    <button class="btn-small no-print" style="background:#25D366; color:white;" onclick="sendVia('whatsapp',${t.id})">💚 হোয়াটসঅ্যাপ</button>
    <button class="btn-small no-print" style="background:#0084FF; color:white;" onclick="sendVia('messenger',${t.id})">💙 মেসেঞ্জার</button>
    <button class="btn-small no-print" style="background:#FF6600; color:white;" onclick="sendVia('imo',${t.id})">🧡 ইমু</button>
    <button class="btn-small btn-danger no-print" onclick="deleteItem('ticket',${t.id})">মুছুন</button>
</div>
